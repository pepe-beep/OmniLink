# P1 (BACKLOG-ROADMAP §2): CI Gate — build ต้องเขียวก่อน merge ทุก PR
# หมายเหตุ: tests ชุด C# target net10.0-windows (WPF/XAML harness) → ต้องรันบน windows runner เท่านั้น
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet-tests:
    name: C# build + tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution ทั้งหมด (รวม XamlLoadHarness — ต้อง 0 error; บทเรียน 27 ต.ค.)
        run: dotnet build OmniLink.slnx -c Release

      - name: Run C# unit tests
        run: dotnet test tests/OmniLink.Tests/OmniLink.Tests.csproj -c Release --no-build

  python-agent-tests:
    name: Python agent unit tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agent unit tests (edge machine / file exchange / policy / win32 map)
        run: |
          python -m unittest tests/unit_agent/test_agent_edge_machine.py -v
          python -m unittest tests/unit_agent/test_agent_file_exchange.py -v
          python -m unittest tests/unit_agent/test_policy_matrix.py -v
          python -m unittest tests/unit_agent/test_agent_win32.py -v
